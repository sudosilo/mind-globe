<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ecdd">
<title>Mind Globe</title>
<style>
:root {
  --paper: #f3ecdd;
  --paper-2: #ebe1cc;
  --card: #fbf7ee;
  --line: #ddd0b6;
  --ink: #2b2114;
  --ink-2: #6b5c45;
  --ink-3: #998a70;
  --accent: #b55a1c;
  --accent-soft: #f1dcc8;
  --ok: #5d8a3c;
  --warn: #c08a1e;
  --bad: #a8432f;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Noto Serif", "Book Antiqua", Georgia, serif;
  --mono: ui-monospace, "SFMono-Regular", "Roboto Mono", "Noto Sans Mono", "DejaVu Sans Mono", Menlo, monospace;
  --bar: 56px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--paper); color: var(--ink); font-family: var(--mono); -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
body { overflow: hidden; }
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }

#bar { position: fixed; top: 0; left: 0; right: 0; height: var(--bar); display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--paper); border-bottom: 1px solid var(--line); z-index: 20; }
#brand { font-family: var(--serif); font-size: 21px; font-weight: 700; white-space: nowrap; }
#brand i { color: var(--accent); font-weight: 400; }
#tabs { display: flex; margin-left: auto; border: 1.5px solid var(--accent); border-radius: 7px; overflow: hidden; }
.tab { padding: 8px 13px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.tab.on { background: var(--accent); color: var(--card); }

.page { position: fixed; top: var(--bar); left: 0; right: 0; bottom: 0; }
.page[hidden] { display: none; }

#stage { position: absolute; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }

#hud { position: absolute; top: 10px; left: 12px; font-size: 10.5px; letter-spacing: .06em; color: var(--ink-2); line-height: 1.75; pointer-events: none; }
#sync { display: flex; align-items: center; gap: 6px; }
#sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
#sync.ok .dot { background: var(--ok); }
#sync.busy .dot { background: var(--warn); }
#sync.bad .dot { background: var(--bad); }

#zoom { position: absolute; top: 10px; right: 12px; display: flex; flex-direction: column; gap: 8px; }
.zbtn { width: 42px; height: 42px; border: 1.5px solid var(--accent); border-radius: 8px; background: var(--card); color: var(--accent); font-size: 21px; font-weight: 700; line-height: 1; }

#sheet { position: absolute; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; background: var(--card); border: 1.5px solid var(--accent); border-radius: 12px; padding: 14px 15px; box-shadow: 0 8px 28px rgba(70, 45, 10, .14); }
.s-kicker { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
.s-title { font-family: var(--serif); font-size: 18px; font-style: italic; color: var(--accent); margin-top: 2px; overflow-wrap: anywhere; }
.s-meta { font-size: 10.5px; color: var(--ink-3); margin-top: 3px; letter-spacing: .03em; }
.s-text { font-size: 12.5px; line-height: 1.55; color: var(--ink); margin-top: 9px; max-height: 6.2em; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
.s-hint { font-size: 12px; line-height: 1.6; color: var(--ink-2); }
.s-link { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font-size: 11px; margin-top: 6px; display: inline-block; text-align: left; }
.row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.btn { flex: 1; min-height: 42px; padding: 0 14px; border-radius: 7px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--card); }
.btn.ghost { border: 1.5px solid var(--accent); color: var(--accent); background: transparent; }
.btn.danger { border: 1.5px solid var(--bad); color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: var(--card); }
.btn.slim { flex: none; }

.seg { display: flex; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; margin-top: 10px; }
.seg button { flex: 1; padding: 9px 4px; font-size: 11px; color: var(--ink-2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }

#modal { position: fixed; inset: 0; background: rgba(43, 33, 20, .45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; padding: 12px; }
#modal[hidden] { display: none; }
#editor { width: 100%; max-width: 520px; background: var(--card); border: 2px solid var(--accent); border-radius: 14px; padding: 18px; margin-bottom: env(safe-area-inset-bottom); }
#editor h3 { font-family: var(--serif); font-size: 20px; }
#ed-sub { font-size: 10.5px; color: var(--ink-3); margin-top: 3px; }
.lbl { display: block; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin-top: 14px; margin-bottom: 6px; }
#ed-region, #ed-text { width: 100%; border: 1.5px solid var(--line); border-radius: 7px; background: #fffdf8; padding: 10px; outline: none; }
#ed-region { font-family: var(--serif); font-style: italic; font-size: 16px; color: var(--accent); }
#ed-text { height: 130px; resize: none; font-size: 14px; line-height: 1.55; }
#ed-region:focus, #ed-text:focus { border-color: var(--accent); }
#ed-count { font-size: 10px; color: var(--ink-3); text-align: right; margin-top: 4px; }

#atlas { overflow-y: auto; padding: 18px 14px 40px; -webkit-overflow-scrolling: touch; }
#atlas-head h2 { font-family: var(--serif); font-size: 24px; }
#atlas-head p { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-top: 4px; }
#regions { display: flex; flex-direction: column; gap: 16px; margin-top: 18px; max-width: 680px; }
.region { border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.region-head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: var(--paper-2); }
.region-name { font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--accent); flex: 1; overflow-wrap: anywhere; }
.region-count { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
.region-rename { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 5px; padding: 5px 8px; }
.region-bar { height: 4px; background: var(--paper-2); }
.region-bar span { display: block; height: 100%; background: var(--accent); opacity: .55; }
.card { padding: 12px 14px; border-top: 1px solid var(--line); }
.card.child { padding-left: 30px; background: #fdf9f1; }
.card-text { font-size: 13px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.card-meta { font-size: 10px; color: var(--ink-3); margin-top: 6px; letter-spacing: .03em; }
.card-actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
.card-actions .btn { flex: none; min-height: 34px; font-size: 10px; padding: 0 11px; }
.card-actions select { border: 1.5px solid var(--line); border-radius: 7px; background: #fffdf8; padding: 7px 8px; font-size: 11px; max-width: 170px; }
.empty { text-align: center; padding: 60px 20px; color: var(--ink-2); }
.empty .big { font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--accent); margin-bottom: 10px; }
.empty p { font-size: 12px; line-height: 1.8; }

#toast { position: fixed; left: 50%; top: calc(var(--bar) + 12px); transform: translateX(-50%); background: var(--ink); color: var(--card); font-size: 12px; padding: 9px 14px; border-radius: 8px; z-index: 60; max-width: 90vw; }
#toast[hidden] { display: none; }

#boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--paper); z-index: 100; font-family: var(--serif); font-size: 22px; font-style: italic; color: var(--accent); }
</style>
</head>
<body>

<div id="boot">Charting the waters</div>

<div id="bar">
  <div id="brand">Mind <i>Globe</i></div>
  <div id="tabs">
    <button class="tab on" data-page="globe">Globe</button>
    <button class="tab" data-page="atlas">Atlas</button>
  </div>
</div>

<section id="page-globe" class="page">
  <div id="stage"></div>
  <div id="hud">
    <div id="sync"><span class="dot"></span><span id="sync-text">Loading</span></div>
    <div id="stats"></div>
  </div>
  <div id="zoom">
    <button class="zbtn" id="zin" aria-label="Zoom in">+</button>
    <button class="zbtn" id="zout" aria-label="Zoom out">-</button>
  </div>
  <div id="sheet"></div>
</section>

<section id="page-atlas" class="page" hidden>
  <div id="atlas">
    <div id="atlas-head">
      <h2>The Atlas</h2>
      <p id="atlas-sub"></p>
    </div>
    <div id="regions"></div>
  </div>
</section>

<div id="modal" hidden>
  <div id="editor">
    <h3 id="ed-title">New note</h3>
    <div id="ed-sub"></div>
    <label class="lbl" for="ed-region">Region</label>
    <input id="ed-region" list="region-list" maxlength="60" autocomplete="off">
    <datalist id="region-list"></datalist>
    <label class="lbl" for="ed-text">Note</label>
    <textarea id="ed-text" maxlength="2000"></textarea>
    <div id="ed-count"></div>
    <span class="lbl">Size of the idea</span>
    <div class="seg" id="ed-size"></div>
    <div class="row">
      <button class="btn ghost" id="ed-cancel">Cancel</button>
      <button class="btn primary" id="ed-save">Raise land</button>
    </div>
  </div>
</div>

<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// ---------- config ----------
const API = 'https://mind-globe-production.up.railway.app';
const STORE_KEY = 'mindglobe.v2';
const R = 2;            // globe radius in scene units
const SEA = 0.3;        // elevation where land breaks the surface
const DETAIL = 64;      // icosphere subdivision, higher = finer coastlines
const D2R = Math.PI / 180;
const SIZES = {
  1: { name: 'Thought', rad: 0.075 },
  2: { name: 'Idea', rad: 0.12 },
  3: { name: 'Big idea', rad: 0.19 },
};
// Elevation to color stops. Lone notes stay sandy, clusters climb to grass, forest, rock, snow.
const TERRAIN = [
  [SEA, 0xeadaa8], [0.85, 0xdcc78e], [1.15, 0xa9c46e], [1.6, 0x77a24f],
  [2.2, 0x557f3e], [2.9, 0x8c7c66], [3.6, 0xb4a896], [4.2, 0xf7f4ee],
];
const DEEP = new THREE.Color(0x4d82b2);
const SHALLOW = new THREE.Color(0x9dcbe0);

// ---------- state ----------
const notes = new Map();             // id -> note
const pending = { up: new Set(), del: new Set() };
let sel = null;                      // {kind:'spot',lat,lon} | {kind:'note',id}
let edit = null;                     // editor state
let landPct = 0;

// ---------- small helpers ----------
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) {
    if (k == null || k === false) continue;
    el.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return el;
}
function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}
function fmtCoord(lat, lon) {
  return `${Math.abs(lat).toFixed(1)}°${lat >= 0 ? 'N' : 'S'}  ${Math.abs(lon).toFixed(1)}°${lon >= 0 ? 'E' : 'W'}`;
}
function snippet(t, n = 48) { t = (t || '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n - 1) + '…' : t; }
let toastTimer = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600); }
function armDelete(btn, action) {
  if (btn.classList.contains('armed')) { action(); return; }
  btn.classList.add('armed'); btn.textContent = 'Tap again';
  setTimeout(() => { if (btn.isConnected) { btn.classList.remove('armed'); btn.textContent = 'Delete'; } }, 3000);
}

// ---------- geo ----------
function toDir(lat, lon) {
  const a = lat * D2R, b = lon * D2R;
  return new THREE.Vector3(Math.cos(a) * Math.sin(b), Math.sin(a), Math.cos(a) * Math.cos(b));
}
function toLatLon(v) {
  return { lat: Math.asin(clamp(v.y, -1, 1)) / D2R, lon: Math.atan2(v.x, v.z) / D2R };
}
function angleBetween(a, b) { return Math.acos(clamp(a.dot(b), -1, 1)); }

// ---------- noise for organic coastlines ----------
function hash3(x, y, z) {
  let h = (Math.imul(x | 0, 73856093) ^ Math.imul(y | 0, 19349663) ^ Math.imul(z | 0, 83492791)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const c000 = hash3(xi, yi, zi), c100 = hash3(xi + 1, yi, zi), c010 = hash3(xi, yi + 1, zi), c110 = hash3(xi + 1, yi + 1, zi);
  const c001 = hash3(xi, yi, zi + 1), c101 = hash3(xi + 1, yi, zi + 1), c011 = hash3(xi, yi + 1, zi + 1), c111 = hash3(xi + 1, yi + 1, zi + 1);
  const x00 = c000 + (c100 - c000) * u, x10 = c010 + (c110 - c010) * u, x01 = c001 + (c101 - c001) * u, x11 = c011 + (c111 - c011) * u;
  const y0 = x00 + (x10 - x00) * v, y1 = x01 + (x11 - x01) * v;
  return y0 + (y1 - y0) * w;
}
function fbm(x, y, z) {
  return (vnoise(x * 4, y * 4, z * 4) * 0.6 + vnoise(x * 9 + 17, y * 9 + 3, z * 9 + 11) * 0.3 + vnoise(x * 19 + 5, y * 19 + 29, z * 19 + 7) * 0.1) * 2 - 1;
}

// ---------- terrain field ----------
// Each note is a bump of land. A branch also lays a low ridge back to its parent,
// so branched ideas read as peninsulas and mountain chains instead of loose dots.
let kernels = [];
function buildKernels() {
  const out = [];
  for (const n of notes.values()) {
    const rad = SIZES[n.size].rad;
    const v = toDir(n.lat, n.lon);
    out.push({ pt: true, x: v.x, y: v.y, z: v.z, rad, cosMax: Math.cos(rad * 1.4), w: 1 });
    const p = n.parent && notes.get(n.parent);
    if (p) {
      const a = toDir(p.lat, p.lon), b = v;
      const nrm = new THREE.Vector3().crossVectors(a, b);
      if (nrm.length() < 1e-6) continue;
      nrm.normalize();
      const arc = angleBetween(a, b);
      const rr = Math.min(rad, SIZES[p.size].rad) * 0.55;
      const mid = a.clone().add(b).normalize();
      out.push({ pt: false, a, b, n: nrm, arc, mid, rad: rr, cosLim: Math.cos(arc / 2 + rr * 1.4), w: 0.7 });
    }
  }
  return out;
}
const _p = new THREE.Vector3(), _c = new THREE.Vector3();
function elevAt(x, y, z, nz) {
  let e = 0;
  const warp = 1 + 0.35 * nz;
  for (const k of kernels) {
    if (k.pt) {
      const d = x * k.x + y * k.y + z * k.z;
      if (d < k.cosMax) continue;
      const t = Math.acos(d > 1 ? 1 : d) / (k.rad * warp);
      if (t < 1) { const q = 1 - t * t; e += q * q * k.w; }
    } else {
      if (x * k.mid.x + y * k.mid.y + z * k.mid.z < k.cosLim) continue;
      _p.set(x, y, z);
      const s = _p.dot(k.n);
      _c.copy(_p).addScaledVector(k.n, -s);
      let dist;
      if (_c.lengthSq() < 1e-9) dist = Math.PI;
      else {
        _c.normalize();
        const along = angleBetween(k.a, _c) + angleBetween(_c, k.b);
        dist = along <= k.arc + 1e-3 ? Math.abs(Math.asin(clamp(s, -1, 1)))
                                    : Math.min(angleBetween(_p, k.a), angleBetween(_p, k.b));
      }
      const t = dist / (k.rad * warp);
      if (t < 1) { const q = 1 - t * t; e += q * q * k.w; }
    }
  }
  return e;
}
function heightOf(e) { return e < SEA ? 0 : Math.min(e - SEA, 4.2) * 0.036; }
const _col = new THREE.Color(), _c2 = new THREE.Color();
function colorOf(e, nz) {
  if (e < SEA) {
    const t = Math.pow(clamp(e / SEA, 0, 1), 1.6);
    _col.copy(DEEP).lerp(SHALLOW, t);
    const j = nz * 0.025; _col.r += j; _col.g += j; _col.b += j;
    return _col;
  }
  for (let i = 0; i < TERRAIN.length - 1; i++) {
    const [e0, c0] = TERRAIN[i], [e1, c1] = TERRAIN[i + 1];
    if (e <= e1) { _col.setHex(c0).lerp(_c2.setHex(c1), (e - e0) / (e1 - e0)); return _col; }
  }
  return _col.setHex(TERRAIN[TERRAIN.length - 1][1]);
}

// ---------- three.js scene ----------
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0xf3ecdd, 1);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
scene.add(new THREE.AmbientLight(0xfff4e2, 0.28));
scene.add(new THREE.HemisphereLight(0xfff7e8, 0xb9a47e, 0.62));
const sun = new THREE.DirectionalLight(0xfff2dc, 0.62);
sun.position.set(4, 5, 6);
scene.add(sun);

const globe = new THREE.Group();
scene.add(globe);

// Shared icosphere: no pole squeeze, no date line seam.
const base = new THREE.IcosahedronGeometry(1, DETAIL);
const basePos = base.attributes.position.array;
const VCOUNT = basePos.length / 3;
const vmap = new Uint32Array(VCOUNT);
const ux = [], uy = [], uz = [];
{
  const seen = new Map();
  for (let i = 0; i < VCOUNT; i++) {
    let x = basePos[i * 3], y = basePos[i * 3 + 1], z = basePos[i * 3 + 2];
    const l = Math.hypot(x, y, z); x /= l; y /= l; z /= l;
    const key = Math.round(x * 1e5) + ',' + Math.round(y * 1e5) + ',' + Math.round(z * 1e5);
    let idx = seen.get(key);
    if (idx === undefined) { idx = ux.length; seen.set(key, idx); ux.push(x); uy.push(y); uz.push(z); }
    vmap[i] = idx;
  }
}
base.dispose();
const U = ux.length;
const UX = Float32Array.from(ux), UY = Float32Array.from(uy), UZ = Float32Array.from(uz);
const NZ = new Float32Array(U);
for (let u = 0; u < U; u++) NZ[u] = fbm(UX[u], UY[u], UZ[u]);
const E = new Float32Array(U);

const terrainGeo = new THREE.BufferGeometry();
const posArr = new Float32Array(VCOUNT * 3);
const colArr = new Float32Array(VCOUNT * 3);
terrainGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
terrainGeo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
const terrain = new THREE.Mesh(terrainGeo, new THREE.MeshPhongMaterial({ vertexColors: true, flatShading: true, shininess: 6, specular: 0x0c0c0c }));
globe.add(terrain);

const halo = new THREE.Mesh(
  new THREE.SphereGeometry(R * 1.07, 48, 48),
  new THREE.MeshBasicMaterial({ color: 0xbfdcef, transparent: true, opacity: 0.16, side: THREE.BackSide, depthWrite: false })
);
scene.add(halo);

// Note markers sit on top of their land.
const dotGeo = new THREE.BufferGeometry();
const dots = new THREE.Points(dotGeo, new THREE.PointsMaterial({ color: 0x3b2c18, size: 5, sizeAttenuation: false }));
globe.add(dots);

// Selection pin.
const pin = new THREE.Group();
{
  const mat = new THREE.MeshPhongMaterial({ color: 0xb55a1c, shininess: 30 });
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.009, 0.009, 0.24, 8), mat);
  stem.position.y = 0.12;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 12), mat);
  head.position.y = 0.25;
  pin.add(stem, head);
  pin.visible = false;
  globe.add(pin);
}
const UP = new THREE.Vector3(0, 1, 0);
function surfaceRadius(v) { return R + heightOf(elevAt(v.x, v.y, v.z, fbm(v.x, v.y, v.z))); }
function placePin() {
  let lat, lon;
  if (sel && sel.kind === 'spot') ({ lat, lon } = sel);
  else if (sel && sel.kind === 'note' && notes.get(sel.id)) ({ lat, lon } = notes.get(sel.id));
  else { pin.visible = false; dirty = true; return; }
  const v = toDir(lat, lon);
  pin.position.copy(v).multiplyScalar(surfaceRadius(v));
  pin.quaternion.setFromUnitVectors(UP, v);
  pin.visible = true;
  dirty = true;
}

function rebuildTerrain() {
  kernels = buildKernels();
  let land = 0;
  for (let u = 0; u < U; u++) {
    const e = elevAt(UX[u], UY[u], UZ[u], NZ[u]);
    E[u] = e;
    if (e >= SEA) land++;
  }
  for (let i = 0; i < VCOUNT; i++) {
    const u = vmap[i], e = E[u], r = R + heightOf(e), o = i * 3;
    posArr[o] = UX[u] * r; posArr[o + 1] = UY[u] * r; posArr[o + 2] = UZ[u] * r;
    const c = colorOf(e, NZ[u]);
    colArr[o] = c.r; colArr[o + 1] = c.g; colArr[o + 2] = c.b;
  }
  terrainGeo.attributes.position.needsUpdate = true;
  terrainGeo.attributes.color.needsUpdate = true;
  terrainGeo.computeVertexNormals();
  terrainGeo.computeBoundingSphere();
  landPct = land / U * 100;

  const pts = [];
  for (const n of notes.values()) {
    const v = toDir(n.lat, n.lon);
    v.multiplyScalar(surfaceRadius(v) + 0.012);
    pts.push(v.x, v.y, v.z);
  }
  dotGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  dotGeo.computeBoundingSphere();
  placePin();
  renderHud();
  dirty = true;
}

// ---------- camera, rotation, input ----------
let yaw = 0.4, pitch = 0.35;
const vel = { yaw: 0, pitch: 0 };
let camDist = 8, camTarget = 8, fitDist = 8, minDist = R + 0.7, maxDist = 12;
let autoSpin = true, dirty = true, fly = null, sized = false;

function resize() {
  const w = stage.clientWidth, hgt = stage.clientHeight;
  if (!w || !hgt) return;
  renderer.setSize(w, hgt, false);
  camera.aspect = w / hgt;
  camera.updateProjectionMatrix();
  const t = Math.tan(camera.fov / 2 * D2R);
  fitDist = R * 1.12 / (t * Math.min(1, camera.aspect));
  maxDist = fitDist * 1.45;
  if (!sized) { camDist = camTarget = fitDist; sized = true; }
  camTarget = clamp(camTarget, minDist, maxDist);
  dirty = true;
}
new ResizeObserver(resize).observe(stage);

function zoomBy(f) { camTarget = clamp(camTarget * f, minDist, maxDist); autoSpin = false; }
$('zin').addEventListener('click', () => zoomBy(0.78));
$('zout').addEventListener('click', () => zoomBy(1.28));

function defaultSize() {
  const z = (camDist - minDist) / Math.max(0.01, fitDist - minDist);
  return z < 0.35 ? 1 : z < 0.8 ? 2 : 3;
}
function dragSpeed() { return 0.0042 * clamp((camDist - R) / (fitDist - R), 0.15, 1.3); }

const ptrs = new Map();
let moved = 0, downAt = 0, pinchD = 0;
function pinchDist() { const [a, b] = [...ptrs.values()]; return Math.hypot(a.x - b.x, a.y - b.y) || 1; }
stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  autoSpin = false; fly = null;
  if (ptrs.size === 1) { moved = 0; downAt = performance.now(); vel.yaw = vel.pitch = 0; }
  else if (ptrs.size === 2) { pinchD = pinchDist(); moved = 999; }
});
stage.addEventListener('pointermove', e => {
  const prev = ptrs.get(e.pointerId);
  if (!prev) return;
  const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) {
    moved += Math.abs(dx) + Math.abs(dy);
    const k = dragSpeed();
    yaw += dx * k; pitch = clamp(pitch + dy * k, -1.45, 1.45);
    vel.yaw = dx * k; vel.pitch = dy * k;
    dirty = true;
  } else if (ptrs.size === 2) {
    const d = pinchDist();
    camTarget = clamp(camTarget * (pinchD / d), minDist, maxDist);
    pinchD = d;
  }
});
function endPointer(e) {
  if (!ptrs.has(e.pointerId)) return;
  const wasSingle = ptrs.size === 1;
  ptrs.delete(e.pointerId);
  if (wasSingle && e.type === 'pointerup' && moved < 8 && performance.now() - downAt < 500) {
    vel.yaw = vel.pitch = 0;
    handleTap(e.clientX, e.clientY);
  }
  if (ptrs.size) vel.yaw = vel.pitch = 0;
}
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('wheel', e => { e.preventDefault(); zoomBy(1 + clamp(e.deltaY, -100, 100) * 0.0015); }, { passive: false });

const raycaster = new THREE.Raycaster();
function handleTap(cx, cy) {
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(((cx - rect.left) / rect.width) * 2 - 1, -((cy - rect.top) / rect.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObject(terrain, false)[0];
  if (!hit) { select(null); return; }
  const v = globe.worldToLocal(hit.point.clone()).normalize();
  let best = null, bestScore = 0;
  for (const n of notes.values()) {
    const a = angleBetween(v, toDir(n.lat, n.lon));
    const reach = SIZES[n.size].rad * 0.9;
    if (a < reach) { const s = 1 - a / reach; if (s > bestScore) { bestScore = s; best = n; } }
  }
  if (best) select({ kind: 'note', id: best.id });
  else { const { lat, lon } = toLatLon(v); select({ kind: 'spot', lat, lon, size: defaultSize() }); }
}

function flyTo(lat, lon) {
  let ty = -lon * D2R;
  while (ty - yaw > Math.PI) ty -= Math.PI * 2;
  while (ty - yaw < -Math.PI) ty += Math.PI * 2;
  fly = { y0: yaw, p0: pitch, y1: ty, p1: clamp(lat * D2R, -1.45, 1.45), t0: performance.now(), dur: 800 };
  autoSpin = false; vel.yaw = vel.pitch = 0;
}

function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) return;
  let moving = false;
  if (fly) {
    const t = clamp((now - fly.t0) / fly.dur, 0, 1);
    const s = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    yaw = fly.y0 + (fly.y1 - fly.y0) * s;
    pitch = fly.p0 + (fly.p1 - fly.p0) * s;
    if (t >= 1) fly = null;
    moving = true;
  } else if (!ptrs.size) {
    if (Math.abs(vel.yaw) > 1e-5 || Math.abs(vel.pitch) > 1e-5) {
      yaw += vel.yaw; pitch = clamp(pitch + vel.pitch, -1.45, 1.45);
      vel.yaw *= 0.93; vel.pitch *= 0.93;
      moving = true;
    } else if (autoSpin) { yaw += 0.0015; moving = true; }
  }
  if (Math.abs(camDist - camTarget) > 1e-3) { camDist += (camTarget - camDist) * 0.22; moving = true; }
  if (moving || dirty) {
    globe.rotation.set(pitch, yaw, 0, 'XYZ');
    camera.position.set(0, 0, camDist);
    camera.lookAt(0, 0, 0);
    renderer.render(scene, camera);
    dirty = false;
  }
}

// ---------- notes ----------
function normalizeNote(n) {
  const size = [1, 2, 3].includes(Number(n.size)) ? Number(n.size) : 2;
  return {
    id: String(n.id),
    text: String(n.text || '').slice(0, 2000),
    region: (String(n.region || '').trim() || 'Unsorted').slice(0, 60),
    lat: clamp(Number(n.lat), -90, 90),
    lon: ((Number(n.lon) + 540) % 360) - 180,
    size,
    parent: n.parent ? String(n.parent) : null,
    created: Number(n.created) || Date.now(),
    updated: Number(n.updated) || Date.now(),
  };
}
function regionsList() {
  const set = new Set();
  for (const n of notes.values()) set.add(n.region);
  return [...set].sort((a, b) => a.localeCompare(b));
}
function childrenOf(id) { return [...notes.values()].filter(n => n.parent === id); }

function commit(changedIds = [], deletedIds = []) {
  for (const id of changedIds) { pending.del.delete(id); pending.up.add(id); }
  for (const id of deletedIds) { pending.up.delete(id); pending.del.add(id); }
  saveLocal();
  rebuildTerrain();
  renderSheet();
  renderAtlas();
  scheduleFlush(300);
}
function upsertNote(n) {
  const clean = normalizeNote({ ...n, updated: Date.now() });
  notes.set(clean.id, clean);
  return clean;
}
function deleteNote(id) {
  if (!notes.has(id)) return;
  notes.delete(id);
  const kids = childrenOf(id);
  for (const k of kids) k.parent = null;
  if (sel && sel.kind === 'note' && sel.id === id) sel = null;
  commit(kids.map(k => k.id), [id]);
}

// Find open water next to a parent for a new branch.
function branchSpot(parent, size) {
  const p = toDir(parent.lat, parent.lon);
  const ref = Math.abs(p.y) > 0.95 ? new THREE.Vector3(1, 0, 0) : UP;
  const e1 = new THREE.Vector3().crossVectors(ref, p).normalize();
  const e2 = new THREE.Vector3().crossVectors(p, e1).normalize();
  const dist = (SIZES[parent.size].rad + SIZES[size].rad) * 0.8;
  let best = null, bestClear = -1;
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2 + 0.3;
    const dir = e1.clone().multiplyScalar(Math.cos(a)).addScaledVector(e2, Math.sin(a));
    const q = p.clone().multiplyScalar(Math.cos(dist)).addScaledVector(dir, Math.sin(dist)).normalize();
    let clear = Infinity;
    for (const n of notes.values()) if (n.id !== parent.id) clear = Math.min(clear, angleBetween(q, toDir(n.lat, n.lon)));
    if (clear > bestClear) { bestClear = clear; best = q; }
  }
  return toLatLon(best);
}

// ---------- selection + bottom sheet ----------
function select(s, opts = {}) {
  sel = s;
  placePin();
  renderSheet();
  if (opts.fly && s) {
    const n = s.kind === 'note' ? notes.get(s.id) : s;
    if (n) flyTo(n.lat, n.lon);
  }
}
function sizeSeg(current, onPick) {
  return h('div', { class: 'seg' }, [1, 2, 3].map(s =>
    h('button', { class: s === current ? 'on' : '', text: SIZES[s].name, onclick: () => onPick(s) })));
}
function renderSheet() {
  const sheet = $('sheet');

  if (sel && sel.kind === 'note' && !notes.get(sel.id)) sel = null;

  if (!sel) {
    sheet.append(

      h('div', { class: 'row' },

        h('button', { class: 'btn primary', text: 'Write note here', onclick: () =>

  const n = notes.get(sel.id);

    h('div', { class: 's-text', text: n.text }),
    parent ? h('button', { class: 's-link', text: 'Branch of: ' + snippet(parent.text), onclick: () => select({ kind: 'note', id: parent.id }, { fly: true }) }) : null,
    h('div', { class: 'row' },
      h('button', { class: 'btn primary', text: 'Edit', onclick: () => openEditor({ mode: 'edit', id: n.id, ...n }) }),
      h('button', { class: 'btn ghost', text: 'Branch', onclick: () => {

        const spot = branchSpot(n, size);
        openEditor({ mode: 'branch', lat: spot.lat, lon: spot.lon, size, region: n.region, parent: n.id });
      } }),
      h('button', { class: 'btn danger slim', text: 'Delete', onclick: e => armDelete(e.currentTarget, () => deleteNote(n.id)) }),
    ),
  ].filter(Boolean));
}

// ---------- editor ----------

function renderEdSize() {

$('ed-text').addEventListener('input', updateCount);

// ---------- example island ----------
function plantExample() {
  const big = upsertNote({ id: uid(), text: 'A big idea sits at the center. The more you write around it, the higher the land climbs.', region: 'Example', lat: 18, lon: -20, size: 3 });
  const ids = [big.id];
  const branches = [
    ['First branch of the big idea. Branches lay a ridge back to their parent.', 2],
    ['Second branch. Stack enough notes together and grass turns to forest.', 2],
    ['A small detail hanging off the big idea.', 1],
  ];
  for (const [text, size] of branches) {
    const spot = branchSpot(big, size);
    ids.push(upsertNote({ id: uid(), text, region: 'Example', lat: spot.lat, lon: spot.lon, size, parent: big.id }).id);
  }
  ids.push(upsertNote({ id: uid(), text: 'A lone thought stays a small sandy island.', region: 'Example', lat: -6, lon: 25, size: 1 }).id);
  ids.push(upsertNote({ id: uid(), text: 'Another stray thought out in open water.', region: 'Example', lat: 40, lon: 30, size: 1 }).id);
  sel = { kind: 'note', id: big.id };
  commit(ids);
  flyTo(big.lat, big.lon);
}

// ---------- atlas ----------
function renderAtlas() {
  const box = $('regions');
  box.replaceChildren();
  const list = [...notes.values()];
  $('atlas-sub').textContent = list.length
    ? `${list.length} note${list.length === 1 ? '' : 's'}  ·  ${regionsList().length} region${regionsList().length === 1 ? '' : 's'}  ·  ${landPct.toFixed(1)}% land`
    : 'No land yet';
  if (!list.length) {
    box.append(h('div', { class: 'empty' },
      h('div', { class: 'big', text: 'The world is all ocean.' }),
      h('p', {}, 'Go to the Globe. Tap the water. Write a thought. Watch land rise.')));
    return;
  }
  const groups = new Map();
  for (const n of list) { if (!groups.has(n.region)) groups.set(n.region, []); groups.get(n.region).push(n); }
  const weight = arr => arr.reduce((s, n) => s + SIZES[n.size].rad ** 2, 0);
  const total = list.reduce((s, n) => s + SIZES[n.size].rad ** 2, 0) || 1;
  const regions = [...groups.entries()].sort((a, b) => weight(b[1]) - weight(a[1]));
  const allRegions = regionsList();

  for (const [region, items] of regions) {
    // parents first, each followed by its branches in the same region
    const ordered = [];
    const inRegion = new Set(items.map(n => n.id));
    const roots = items.filter(n => !n.parent || !inRegion.has(n.parent)).sort((a, b) => b.size - a.size || a.created - b.created);
    const walk = (n, depth) => { ordered.push([n, depth]); items.filter(c => c.parent === n.id).sort((a, b) => a.created - b.created).forEach(c => walk(c, depth + 1)); };
    roots.forEach(r => walk(r, 0));

    box.append(h('div', { class: 'region' },
      h('div', { class: 'region-head' },
        h('div', { class: 'region-name', text: region }),
        h('div', { class: 'region-count', text: `${items.length} note${items.length === 1 ? '' : 's'}` }),
        h('button', { class: 'region-rename', text: 'Rename', onclick: () => renameRegion(region) })),
      h('div', { class: 'region-bar' }, h('span', { style: `width:${Math.max(3, weight(items) / total * 100).toFixed(1)}%` })),
      ordered.map(([n, depth]) => noteCard(n, depth, allRegions)),
    ));
  }
}
function noteCard(n, depth, allRegions) {
  const parent = n.parent && notes.get(n.parent);
  const move = h('select', { 'aria-label': 'Move to region', onchange: e => {
    const v = e.target.value;
    e.target.value = '';
    if (!v) return;
    let target = v;
    if (v === '__new__') {
      const name = (prompt('New region name') || '').trim();
      if (!name) return;
      target = name.slice(0, 60);
    }
    if (target === n.region) return;
    upsertNote({ ...n, region: target });
    commit([n.id]);
    toast(`Moved to ${target}`);
  } },
    h('option', { value: '', text: 'Move to…' }),
    allRegions.filter(r => r !== n.region).map(r => h('option', { value: r, text: r })),
    h('option', { value: '__new__', text: 'New region…' }));
  return h('div', { class: 'card' + (depth ? ' child' : ''), style: depth > 1 ? `padding-left:${14 + depth * 16}px` : null },
    h('div', { class: 'card-text', text: n.text }),
    h('div', { class: 'card-meta', text: `${SIZES[n.size].name}  ·  ${fmtCoord(n.lat, n.lon)}` + (parent ? `  ·  branch of: ${snippet(parent.text, 30)}` : '') }),
    h('div', { class: 'card-actions' },
      h('button', { class: 'btn ghost', text: 'Show', onclick: () => { showPage('globe'); select({ kind: 'note', id: n.id }, { fly: true }); } }),
      move,
      h('button', { class: 'btn danger', text: 'Delete', onclick: e => armDelete(e.currentTarget, () => deleteNote(n.id)) })));
}
function renameRegion(old) {
  const name = (prompt('Rename region', old) || '').trim().slice(0, 60);
  if (!name || name === old) return;
  const ids = [];
  for (const n of notes.values()) if (n.region === old) { upsertNote({ ...n, region: name }); ids.push(n.id); }
  commit(ids);
}

// ---------- pages ----------
function showPage(name) {
  $('page-globe').hidden = name !== 'globe';
  $('page-atlas').hidden = name !== 'atlas';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.page === name));
  if (name === 'atlas') renderAtlas();

}
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => showPage(t.dataset.page)));

function renderHud() {
  const n = notes.size, r = regionsList().length;

// ---------- storage + sync ----------
// The phone keeps a full copy. The server gets every change; if it is down,
// changes queue up and retry. Notes missing from the server get re-sent.
function saveLocal() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ notes: [...notes.values()], up: [...pending.up], del: [...pending.del] }));
  } catch (e) { /* storage full or blocked: server copy still works */ }
}
function loadLocal() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    for (const n of data.notes || []) { const c = normalizeNote(n); if (isFinite(c.lat) && isFinite(c.lon)) notes.set(c.id, c); }
    for (const id of data.up || []) pending.up.add(id);
    for (const id of data.del || []) pending.del.add(id);
  } catch (e) { /* corrupt cache: start clean, server will refill */ }
}
function setSync(kind, text) { $('sync').className = kind; $('sync-text').textContent = text; }

async function req(path, opt = {}) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 10000);
  try {
    const res = await fetch(API + path, { ...opt, signal: ctl.signal });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const type = res.headers.get('content-type') || '';
    return type.includes('json') ? res.json() : null;
  } finally { clearTimeout(timer); }
}
function toWire(n) {
  return { id: n.id, cell_id: n.id, text: n.text, note: n.text, region: n.region, lat: n.lat, lon: n.lon, size: n.size, parent: n.parent, created_at: n.created, updated_at: n.updated };
}
async function pull() {
  setSync('busy', 'Loading');
  try {
    const rows = await req('/notes');
    if (Array.isArray(rows)) mergeServer(rows);
    setSync('ok', 'Synced');
  } catch (e) {
    setSync('bad', 'Offline, saved on this phone');
  }
  scheduleFlush(0);
}
function mergeServer(rows) {
  const seen = new Set();
  for (const r of rows) {
    const id = String(r.id ?? r.cell_id ?? '');
    if (!id) continue;
    seen.add(id);
    if (pending.del.has(id)) continue;
    if (pending.up.has(id) && notes.has(id)) continue;
    const lat = Number(r.lat), lon = Number(r.lon);
    if (!isFinite(lat) || !isFinite(lon)) continue;
    const old = notes.get(id);
    notes.set(id, normalizeNote({
      id, lat, lon,
      text: r.text ?? r.note ?? '',
      region: r.region,
      size: r.size ?? old?.size,
      parent: r.parent !== undefined ? r.parent : old?.parent,
      created: r.created_at ?? old?.created,
      updated: r.updated_at ?? old?.updated,
    }));
  }
  for (const id of notes.keys()) if (!seen.has(id)) pending.up.add(id);
  saveLocal();
  rebuildTerrain();
  renderSheet();
  renderAtlas();
}
let flushing = false, flushTimer = 0;
function scheduleFlush(ms) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, ms); }
async function flush() {
  if (flushing) { scheduleFlush(500); return; }
  if (!pending.up.size && !pending.del.size) return;
  flushing = true;
  setSync('busy', 'Saving');
  let failed = false;
  for (const id of [...pending.del]) {
    try { await req('/notes/' + encodeURIComponent(id), { method: 'DELETE' }); pending.del.delete(id); }
    catch (e) { failed = true; break; }
  }
  if (!failed) for (const id of [...pending.up]) {
    const n = notes.get(id);
    if (!n) { pending.up.delete(id); continue; }
    try {
      await req('/notes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(toWire(n)) });
      pending.up.delete(id);
    } catch (e) { failed = true; break; }
  }
  saveLocal();
  flushing = false;
  if (failed) { setSync('bad', 'Offline, saved on this phone'); scheduleFlush(30000); }
  else setSync('ok', 'Synced');
}
window.addEventListener('online', () => scheduleFlush(0));

// ---------- boot ----------
loadLocal();
resize();
rebuildTerrain();
renderSheet();
renderAtlas();
$('boot').remove();
requestAnimationFrame(frame);
pull();
</script>
</body>
